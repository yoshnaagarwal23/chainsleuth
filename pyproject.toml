[project]
name = "chainsleuth"
version = "0.0.1"
description = "Multi-agent on-chain fraud investigator for Ethereum wallets"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
